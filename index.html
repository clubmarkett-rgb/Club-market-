<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Club Market</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-192.png"><meta name="theme-color" content="#246CB4"><script src="/config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--b:#246CB4;--bd:#174B7C;--sky:#DCEEFF;--cr:#F7F4E9;--tx:#172033;--g:#16A34A;--r:#DC4545;--m:#6B7A90;--ln:#E3EBF4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}html,body{height:100%}*{box-sizing:border-box;margin:0}
body{font:15px/1.45 'Plus Jakarta Sans','Noto Sans Devanagari',system-ui,sans-serif;background:#fff;color:var(--tx);-webkit-tap-highlight-color:transparent}
#app{height:100%}
.c{min-height:100%;display:grid;place-items:center;padding:20px;background:var(--cr)}
.box{background:#fff;border-radius:28px;padding:26px 22px;width:100%;max-width:400px;display:grid;gap:8px;box-shadow:0 8px 30px #246cb41f}
.lg{width:92px;height:92px;border-radius:24px;margin:0 auto;display:block}
.cen{text-align:center}.mut{color:var(--m)}small{font-size:12.5px}
h1{font-size:22px;font-weight:800;color:var(--bd);letter-spacing:1px}h2{font-size:20px;font-weight:800}h3{font-size:17px;font-weight:800}
label{font-size:12.5px;font-weight:700;color:var(--bd);display:block;margin:6px 0 3px}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid #D5E3F1;border-radius:14px;font:inherit;background:#fff;color:var(--tx);outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--b)}
.pw{position:relative}.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:0;font-size:18px;padding:8px;cursor:pointer}
.btn{border:0;border-radius:14px;padding:13px 16px;font:inherit;font-weight:800;background:var(--b);color:#fff;cursor:pointer;transition:.15s}.btn:active{transform:scale(.97)}
.btn.s{background:var(--sky);color:var(--bd)}.btn.r{background:var(--r)}.btn.g{background:var(--g)}.btn.l{background:0;color:var(--b);padding:8px 10px}
.card{background:#fff;border:1px solid var(--ln);border-radius:20px;padding:16px;display:grid;gap:10px;align-content:start}
.w{max-width:1080px;margin:auto;padding:16px 16px 96px;display:grid;gap:14px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.g{display:grid;gap:12px}.g4{grid-template-columns:repeat(2,1fr)}.gc{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.up{color:var(--g)}.dn{color:var(--r)}.kv{padding:4px 0;border-bottom:1px dashed var(--ln)}.kv:last-child{border:0}
.bd{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:800;flex:none}
.big2{font-size:20px;font-weight:800}.ic{font-size:20px}
.bell{position:relative;width:46px;height:46px;border-radius:50%;border:2px solid var(--sky);background:#fff;font-size:20px;cursor:pointer}
.dot{position:absolute;top:7px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--r);border:2px solid #fff}
.pc{background:var(--b);color:#fff;border-radius:28px;padding:22px;display:grid;gap:28px;position:relative;overflow:hidden}
.pc::before{content:"";position:absolute;right:-70px;top:-90px;width:250px;height:250px;border-radius:50%;background:#ffffff12}
.pc>div{position:relative}.pc .wv{position:absolute;right:0;bottom:0;width:62%;opacity:.28}
.big{font-size:clamp(40px,12vw,58px);font-weight:800;line-height:1.05}.big em{font-size:18px;font-style:normal;font-weight:600;margin-left:6px;opacity:.85}
.plus{width:58px;height:58px;border-radius:50%;border:2px solid #fff;background:0;color:#fff;font-size:34px;line-height:1;cursor:pointer;transition:.2s;flex:none}.plus:hover,.plus:active{background:#fff;color:var(--b);transform:scale(1.08)}
.pb{display:flex;gap:36px}.pb small{opacity:.8;display:block}.pb b{font-size:21px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{flex:1;border:0;background:0;font:inherit;font-size:12px;font-weight:600;color:var(--m);padding:6px;cursor:pointer;border-radius:12px}.nav i{display:block;font-style:normal;font-size:20px}.nav .on{color:var(--b);font-weight:800}
@media(min-width:760px){.g4{grid-template-columns:repeat(4,1fr)}}
@media(min-width:900px){.nav{right:auto;top:0;width:190px;flex-direction:column;justify-content:flex-start;gap:6px;padding:24px 12px;border:0;border-right:1px solid var(--ln)}.nav button{display:flex;gap:10px;align-items:center;font-size:14px;padding:12px}.nav i{display:inline}.nav .on{background:var(--sky)}.main{margin-left:190px}.w{padding-bottom:28px}}
.mo{position:fixed;inset:0;background:rgba(23,32,51,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh{background:#fff;width:100%;max-width:460px;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;display:grid;gap:6px;animation:up .25s}
@media(min-width:600px){.mo{align-items:center}.sh{border-radius:24px}}
@keyframes up{from{transform:translateY(24px);opacity:0}}@keyframes pop{from{transform:scale(.7);opacity:0}}@keyframes ld{to{width:100%}}@keyframes dr{to{stroke-dashoffset:0}}
.pop{animation:pop .7s}.bar{width:170px;height:5px;border-radius:9px;background:var(--sky);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--b);animation:ld 1.7s ease-out forwards}
.tk{stroke-dasharray:50;stroke-dashoffset:50;animation:dr .6s .2s forwards}
#ts{position:fixed;left:0;right:0;bottom:calc(86px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:6px;z-index:20;pointer-events:none}
.ts{background:var(--bd);color:#fff;padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px;animation:up .25s}.ts.bad{background:var(--r)}
.otp input{padding:12px 0}summary{cursor:pointer}details p{margin-top:6px}
.i{flex:none}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px}.c{align-content:center}
.ic{display:inline-flex;color:var(--b)}.bell,.plus{display:grid;place-items:center;padding:0}.bell{color:var(--bd)}.pw button{color:var(--m);display:grid}
.pill{display:inline-block;background:var(--sky);color:var(--bd);border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:700}
.nav button{position:relative;display:grid;place-items:center;height:48px}.nav .on::after{content:"";position:absolute;bottom:1px;width:18px;height:3px;border-radius:3px;background:var(--b)}
.nav button:focus-visible,.btn:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.c .cen>h1,.c .cen>small,.c .bar{animation:fi .8s .3s both}@keyframes fi{from{opacity:0;transform:translateY(8px)}}
@media(min-width:900px){.nav{width:76px;align-items:center;padding:24px 8px;justify-content:flex-start}.nav button{width:52px;flex:none}.nav .on::after{bottom:auto;left:-8px;width:3px;height:22px}.main{margin-left:76px}.nav button:hover::before{content:attr(aria-label);position:absolute;left:60px;background:var(--bd);color:#fff;font-size:12px;font-weight:600;padding:5px 9px;border-radius:8px;white-space:nowrap;z-index:9}}
.pc>.row{display:grid;grid-template-columns:minmax(0,1fr) 58px;gap:14px;align-items:start}.pc>.row>div:first-child{min-width:0}
.pc .big{display:flex;align-items:baseline;gap:6px;min-width:0}.pc .big span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pc .big em{flex:none;margin:0}
.pb{flex-wrap:wrap;gap:10px 28px}.pb b{overflow-wrap:anywhere}
.dot{display:grid;place-items:center;width:auto;min-width:18px;height:18px;padding:0 4px;top:1px;right:1px;font-size:10px;font-style:normal;font-weight:800;color:#fff;border-radius:9px}
.btn.g,.btn[data-a=buy]{background:#15803D;color:#fff}.btn.r,.btn[data-a=sell]{background:#D32F2F;color:#fff}.btn[data-a=buy],.btn[data-a=sell]{min-height:44px}
.btn.g:hover,.btn[data-a=buy]:hover{background:#116B32}.btn.r:hover,.btn[data-a=sell]:hover{background:#B71C1C}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
</style></head><body><div id="app"></div><div id="mo"></div><div id="ts"></div>
